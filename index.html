<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bienvenido al Inventario</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.4);
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom right, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
      z-index: -1;
    }

    .content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      animation: fadeInZoom 2s ease;
    }

    .content h1 {
      font-size: 3rem;
      margin-bottom: 30px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      animation: pulse 5s infinite;
    }

    .btn {
      padding: 14px 30px;
      font-size: 1.1rem;
      color: white;
      background: #e26d91;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      transition: 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn:hover {
      background: #d3597e;
      transform: scale(1.05);
    }

    .top-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    .top-buttons a {
      font-size: 0.95rem;
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 50px;
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
      transition: all 0.3s;
    }

    .top-buttons a:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    @keyframes fadeInZoom {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    @media (max-width: 768px) {
      .content h1 {
        font-size: 2rem;
      }
      .btn {
        padding: 10px 20px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <video class="video-background" autoplay muted loop>
    <source src="video-fondo.mp4" type="video/mp4">
    Tu navegador no soporta videos en HTML5.
  </video>

  <div class="overlay"></div>

  <!-- Botones superiores -->
  <div class="top-buttons">
    <a href="#acerca-de" onclick="mostrarAcercaDe()">Acerca de</a>
  </div>

  <div class="content">
    <h1>Bienvenido al Inventario de productos Yanbal</h1>
    <a href="inventario.html" class="btn">Entrar al Inventario</a>
  </div>

  <script>
    function mostrarAcercaDe() {
      alert('Este es un inventario de productos Yambal. Aquí podrás gestionar tu inventario, categorías, productos y más.');
    }
  </script>
</body>
</html>
